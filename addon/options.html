<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Salesforce Event Manager — Settings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'Salesforce Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; background: #f3f3f3; color: #181818; margin: 0; padding: 0; }
    .opt-shell { max-width: 600px; margin: 0 auto; padding: 32px 24px; }
    .opt-header { background: #032d60; color: #fff; padding: 16px 24px; display: flex; align-items: center; gap: 10px; }
    .opt-header h1 { font-size: 16px; font-weight: 700; margin: 0; }
    .opt-card { background: #fff; border-radius: 6px; border: 1px solid #e5e7eb; margin-bottom: 20px; overflow: hidden; }
    .opt-card-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #6b7280; padding: 10px 16px; border-bottom: 1px solid #e5e7eb; background: #f8f9fb; }
    .opt-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #f0f0f0; }
    .opt-row:last-child { border-bottom: none; }
    .opt-label { flex: 1; font-size: 13px; color: #374151; }
    .opt-label small { display: block; font-size: 11px; color: #6b7280; margin-top: 2px; }
    .opt-input { font-size: 13px; border: 1px solid #d1d5db; border-radius: 4px; padding: 4px 8px; height: 28px; width: 220px; }
    .opt-input:focus { outline: none; border-color: #0176d3; box-shadow: 0 0 0 2px rgba(1,118,211,0.2); }
    .opt-btn { font-size: 12px; font-weight: 600; padding: 4px 14px; border-radius: 4px; border: 1px solid #0176d3; background: #fff; color: #0176d3; cursor: pointer; height: 28px; }
    .opt-btn:hover { background: #f0f5ff; }
    .opt-btn--primary { background: #0176d3; color: #fff; }
    .opt-btn--primary:hover { background: #014486; }
    .opt-saved { font-size: 11px; color: #166534; }
    .opt-about-text { font-size: 12px; color: #374151; line-height: 1.6; padding: 12px 16px; }
    .opt-about-text a { color: #0176d3; }
    .opt-donate-row { padding: 0 16px 14px; }
    .opt-donate-btn { display: inline-block; text-decoration: none; font-size: 13px; font-weight: 600; padding: 6px 18px; border-radius: 4px; background: #0176d3; color: #fff; }
    .opt-donate-btn:hover { background: #014486; }
  </style>
</head>
<body>
  <div class="opt-header">
    <h1>Salesforce Event Manager — Settings</h1>
  </div>
  <div class="opt-shell">
    <div id="root"></div>
  </div>
  <script src="react.js"></script>
  <script src="react-dom.js"></script>
  <script type="module" src="options.js"></script>
</body>
</html>
